<form method="POST" action="{{ url_for('customers.customer_edit', customer_id=customer.customer_id) if customer else url_for('customers.customer_add') }}">
    
    <div class="row">
        <div class="col-md-6">
            <h5 class="text-primary mb-3">Osobní údaje</h5>
            <div class="mb-3">
                <label for="first_name" class="form-label">Jméno (*):</label>
                <input type="text" class="form-control" id="first_name" name="first_name" 
                       value="{{ customer.first_name if customer else '' }}" required>
            </div>

            <div class="mb-3">
                <label for="last_name" class="form-label">Příjmení (*):</label>
                <input type="text" class="form-control" id="last_name" name="last_name" 
                       value="{{ customer.last_name if customer else '' }}" required>
            </div>

            <div class="mb-3">
                <label for="date_of_birth" class="form-label">Datum narození:</label>
                <input type="date" class="form-control" id="date_of_birth" name="date_of_birth" 
                       value="{{ customer.date_of_birth.strftime('%Y-%m-%d') if customer and customer.date_of_birth else '' }}">
            </div>
        </div>

        <div class="col-md-6">
            <h5 class="text-primary mb-3">Kontakt a Adresa</h5>
            <div class="mb-3">
                <label for="email" class="form-label">Email (Login) (*):</label>
                <input type="email" class="form-control" id="email" name="email" 
                       value="{{ customer.user.email if customer and customer.user else '' }}" required>
                {% if not customer %}
                <div class="form-text small">Bude vytvořen účet s heslem "12345".</div>
                {% endif %}
            </div>

            <div class="mb-3">
                <label for="street" class="form-label">Ulice a číslo:</label>
                <input type="text" class="form-control" id="street" name="street" 
                       value="{{ customer.addresses[0].street if customer and customer.addresses else '' }}">
            </div>

            <div class="row">
                <div class="col-md-7">
                    <div class="mb-3">
                        <label for="city" class="form-label">Město:</label>
                        <input type="text" class="form-control" id="city" name="city" 
                               value="{{ customer.addresses[0].city if customer and customer.addresses else '' }}">
                    </div>
                </div>
                <div class="col-md-5">
                    <div class="mb-3">
                        <label for="zip_code" class="form-label">PSČ:</label>
                        <input type="text" class="form-control" id="zip_code" name="zip_code" 
                               value="{{ customer.addresses[0].zip_code if customer and customer.addresses else '' }}">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="text-end border-top pt-3 mt-2">
        {% if request.headers.get('X-Requested-With') == 'XMLHttpRequest' %}
            <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Zrušit</button>
        {% else %}
            <a href="{{ url_for('customers.customers_list') }}" class="btn btn-secondary me-2">Zrušit</a>
        {% endif %}
        
        <button type="submit" class="btn btn-primary">
            {% if customer %}Uložit změny{% else %}Vytvořit zákazníka{% endif %}
        </button>
    </div>
</form>
